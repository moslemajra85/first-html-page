<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML FORM</title>

    <style>
      input {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <form>
      <div><label>Full Name</label></div>
      <input
        type="text"
        placeholder="Please type your first name and last name"
      />

      <!-- Email -->
      <div>
        <label>Email</label>
      </div>

      <input type="email" placeholder="Please type your email address"/>

      <div>
        <label>Password</label>
      </div>
      <input type="password" placeholder="Please type your password" />

      <div>
        <label>Message</label>
      </div>
      <textarea></textarea>

      <button type="submit" disabled>Submit</button>
    </form>
  </body>
</html>
